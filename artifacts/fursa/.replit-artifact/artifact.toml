kind = "web"
previewPath = "/"
title = "Fursa - Digital Employment Platform"
version = "1.0.0"
id = "artifacts/fursa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22659

[services.development]
run = "pnpm --filter @workspace/fursa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fursa", "run", "build" ]
publicDir = "artifacts/fursa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22659"
BASE_PATH = "/"
