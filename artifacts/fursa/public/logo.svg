<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#1D4ED8"/>
  <!-- Subtle gradient overlay -->
  <rect width="200" height="200" rx="40" fill="url(#grad)" opacity="0.3"/>

  <!-- Briefcase body -->
  <rect x="42" y="80" width="116" height="82" rx="10" fill="white" opacity="0.95"/>
  <!-- Briefcase top bar (handle area) -->
  <rect x="42" y="80" width="116" height="18" rx="10" fill="white"/>
  <!-- Handle -->
  <path d="M76 80 C76 65 124 65 124 80" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Center clasp -->
  <rect x="90" y="116" width="20" height="14" rx="4" fill="#1D4ED8"/>
  <!-- Horizontal band -->
  <rect x="42" y="116" width="116" height="14" fill="white" opacity="0.2"/>

  <!-- Star / sparkle accent (top-right) -->
  <circle cx="152" cy="52" r="10" fill="#FBBF24"/>
  <path d="M152 44 L153.5 49.5 L159 51 L153.5 52.5 L152 58 L150.5 52.5 L145 51 L150.5 49.5 Z" fill="white"/>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
</svg>
